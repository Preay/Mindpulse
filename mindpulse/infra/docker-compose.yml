version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: mindpulse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mindpulse
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mindpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: mindpulse-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mindpulse
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mindpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: mindpulse-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://user:pass@postgres:5432/mindpulse
      MONGODB_URI: mongodb://mongodb:27017/mindpulse
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-min-32-chars-required}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 30d
      AI_ENGINE_URL: http://ai-engine:8000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: mindpulse-audio
      AWS_REGION: us-east-1
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/api:/app
      - /app/node_modules

  ai-engine:
    build:
      context: ../services/ai-engine
      dockerfile: Dockerfile
    container_name: mindpulse-ai-engine
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://user:pass@postgres:5432/mindpulse
      MODEL_PATH: ./models/burnout_model.pkl
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../services/ai-engine:/app
      - ../services/ai-engine/models:/app/models

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  default:
    name: mindpulse-network
